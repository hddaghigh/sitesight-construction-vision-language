name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      # The viewer group is needed so mypy can see the PyQt6 type stubs; the default pytest
      # run still skips GUI tests (they run in the `viewer` job below).
      - run: uv sync --group viewer
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  viewer:
    # GUI tests on Qt's offscreen platform (no display needed).
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - run: pip install uv
      - run: uv sync --group viewer
      - run: uv run pytest -m viewer

  docker:
    # Builds the CPU serving image and checks the installed package imports inside it. The model
    # is not baked in, so this does not start the API (that needs exported weights).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sitesight:ci .
      - run: docker run --rm sitesight:ci python -c "import sitesight.serve.api, sitesight.serve.onnx_backend, onnxruntime, tokenizers, fastapi; print('imports ok')"
