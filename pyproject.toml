[project]
name = "sitesight"
version = "0.1.0"
description = "Grounded construction-site understanding from drone images (region captions, boxes, structured summary)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# The VIA parser, validator, caption parser and downloader use only the standard library.
# numpy + Pillow are needed from M2 on (perceptual hashes, similarity matrices, clustering).
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Desktop review/audit tool (laptop only; Colab has no display).
viewer = [
    "PyQt6>=6.6",
]
# Image embeddings for dedup / grouped splits (laptop `.venv-embed` or Colab).
embed = [
    "torch",
    "transformers",
    "scipy",  # required by the OWLv2 image processor (zero-shot baseline)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sitesight"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]  # Colab cells use shell magics and are not library code

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests carry hand-derivations in comments; wrapping them would hurt readability.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["sitesight", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*"]
ignore_missing_imports = true  # optional heavy deps, only in the `embed` group

[tool.pytest.ini_options]
testpaths = ["tests"]
# Opt-in tests (not run by default / in CI):
#   real_data: needs the extracted dataset (SITESIGHT_DATA_DIR)      pytest -m real_data
#   embed:     needs torch + transformers + the DINOv2 weights       pytest -m embed
#   viewer:    needs PyQt6 (offscreen platform)                      pytest -m viewer
addopts = "-m 'not real_data and not embed and not viewer' -ra"
markers = [
    "real_data: needs the real extracted dataset; run with -m real_data",
    "embed: needs torch/transformers and DINOv2 weights; run with -m embed",
    "viewer: needs PyQt6; run with -m viewer",
]
